name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's ubuntu runners ship the Android SDK preinstalled
      # (ANDROID_HOME), but sdkmanager is not on PATH; call it by full path.
      # Note: the API 37 platform package is 'platforms;android-37.0'
      # (minor-versioned platform); AGP accepts it for compileSdk 37.
      - name: Install SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      # The repo pins a JetBrains 25 daemon JVM and a Windows JBR path for
      # local Android Studio use; neutralize both in the CI checkout only.
      - name: Neutralize local-only Gradle settings
        run: |
          rm -f gradle/gradle-daemon-jvm.properties
          sed -i '/^org.gradle.java.installations.paths=/d' gradle.properties

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
